[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hanssem-macro-dashboard"
version = "0.1.0"
description = "Macro ETL and dashboard for Hanssem top-line leading indicators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1.5",
  "pandas>=2.2.2",
  "plotly>=5.24.1",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
  "streamlit>=1.44.0",
  "xlrd>=2.0.1",
]

[project.optional-dependencies]
bigquery = [
  "google-cloud-bigquery>=3.26.0",
  "pandas-gbq>=0.26.1",
  "db-dtypes>=1.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
